services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spotapp}
      POSTGRES_USER: ${POSTGRES_USER:-spotapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-spotapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spotapp}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALGORITHM: HS256
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    profiles: ["seed"]
    environment:
      DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-spotapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spotapp}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALGORITHM: HS256
    command: ["python", "scripts/seed_gijon.py"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  postgres_data:
